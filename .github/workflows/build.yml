 screenshot builds with sample data (not part of the download)tail -5 shots/simulator.log || true

      - name: Publish screenshots to the screenshots branch
        continue-on-error: true
        run: |
 screenshot builds with sample data (not part of the download)cd shots
 screenshot builds with sample data (not part of the download)git init -q
 screenshot builds with sample data (not part of the download)git checkout -q -b screenshots
 screenshot builds with sample data (not part of the download)git add *.png *.log
 screenshot builds with sample data (not part of the download)git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots build ${{ github.run_number }}"
