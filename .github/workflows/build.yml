name: Build data field

on:
  push:
    branches-ignore:
      - screenshots
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Run the simulator and publish screenshots"
        type: boolean
        default: false

# Screenshots only when agreed: manual run with the option, or "[screenshots]"
# in the commit message. Otherwise the job builds the .prg/.iq only.
env:
  SCREENSHOTS: ${{ github.event.inputs.screenshots == 'true' || contains(github.event.head_commit.message, '[screenshots]') }}

jobs:
  build:
    # 22.04: the Connect IQ simulator needs libwebkit2gtk-4.0
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Connect IQ SDK manager
        run: |
          curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download SDK and devices
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::error::Add GARMIN_USERNAME and GARMIN_PASSWORD in Settings > Secrets and variables > Actions"
            exit 1
          fi
          connect-iq-sdk-manager agreement accept
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "*"
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"
          echo "SDK_BIN=$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_ENV"
          connect-iq-sdk-manager device download --manifest=manifest.xml --include-fonts

      - name: Developer key
        env:
          DEVELOPER_KEY_B64: ${{ secrets.DEVELOPER_KEY_B64 }}
        run: |
          if [ -n "$DEVELOPER_KEY_B64" ]; then
            echo "$DEVELOPER_KEY_B64" | base64 -d > developer_key.der
          else
            echo "::warning::DEVELOPER_KEY_B64 not set, using a temporary key (fine for sideload, not for Store updates)"
            openssl genrsa -out developer_key.pem 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt
          fi

      - name: Build
        run: |
          info() {
            printf 'const BUILD_NUMBER = "%s";\nconst DEMO_MODE = %s;\n' "${{ github.run_number }}" "$1" > source/BuildInfo.mc
          }
          mkdir -p bin demo
          info 0
          for d in edge830 edge840; do
            monkeyc -f monkey.jungle -d "$d" -o "bin/PowerZonesSS_$d.prg" -y developer_key.der
          done
          monkeyc -f monkey.jungle -e -o bin/PowerZonesSS.iq -y developer_key.der
          # Screenshot builds with sample data (not part of the download)
          [ "$SCREENSHOTS" = "true" ] || exit 0
          # (DEMO_MODE 3 = font calibration screen, only needed for new devices)
          for m in 1 2; do
            info "$m"
            for d in edge830 edge840; do
              monkeyc -f monkey.jungle -d "$d" -o "demo/demo${m}_$d.prg" -y developer_key.der
            done
          done
          info 0

      - uses: actions/upload-artifact@v4
        with:
          name: PowerZonesSS-build${{ github.run_number }}
          path: |
            bin/*.prg
            bin/*.iq

      - name: Simulator screenshots
        if: env.SCREENSHOTS == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libwebkit2gtk-4.0-37 libusb-1.0-0 libsm6 libxxf86vm1 libsdl2-2.0-0 > /dev/null
          echo "missing libraries:"; ldd "$SDK_BIN/simulator" | grep "not found" || echo none
          xvfb-run -a -s "-screen 0 1280x1024x24" ci/screenshots.sh
          tail -5 shots/simulator.log || true

      - name: Publish screenshots to the screenshots branch
        if: env.SCREENSHOTS == 'true'
        continue-on-error: true
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
