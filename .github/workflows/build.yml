      - name: Simulator screenshots
        continue-on-error: true
        run: |
 screenshot builds with sample data (not part of the download)sudo apt-get update -qq
 screenshot builds with sample data (not part of the download)sudo apt-get install -y -qq xvfb imagemagick libwebkit2gtk-4.0-37 libusb-1.0-0 libsm6 libxxf86vm1 libsdl2-2.0-0 > /dev/null
